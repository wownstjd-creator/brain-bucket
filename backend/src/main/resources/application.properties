spring.application.name=brain-bucket-backend

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/brain_bucket}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

app.upload-dir=${UPLOAD_DIR:uploads}
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Adopt the known pre-Flyway schema at V1; empty databases run V1 then V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
